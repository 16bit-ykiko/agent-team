[project]
name = "discord-agent-team"
version = "0.1.0"
description = "Multi-agent team on Discord powered by Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
]

[project.scripts]
discord-agent-team = "src.main:run"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
