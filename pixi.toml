[workspace]
name = "agent-team"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
nodejs = ">=22"

[tasks]
# Webview UI
dev-webview = { cmd = "npm run dev", cwd = "webview-ui" }
build-webview = { cmd = "npm run build", cwd = "webview-ui" }

# Server bundle
build-server = "node esbuild.js"

# Build everything (server needs dist/webview to serve)
build = { depends-on = ["build-webview", "build-server"] }

# Run the server (serves HTTP + WS on :9800)
serve = { cmd = "node dist/server.js", depends-on = ["build"] }

# Tests (server + webview)
test = "npm test"

# Formatting
fmt = "npm run fmt"
fmt-check = "npm run fmt:check"
