[workspace]
name = "agent-team"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
nodejs = ">=22"

[tasks]
# Webview UI
dev-webview = { cmd = "npm run dev", cwd = "webview-ui" }
build-webview = { cmd = "npm run build", cwd = "webview-ui" }

# Extension + server bundle
build-ext = "node esbuild.js"

# Build everything (server needs dist/webview to serve)
build = { depends-on = ["build-webview", "build-ext"] }

# Run the server (serves HTTP + WS on :9800)
serve = { cmd = "node dist/server.js", depends-on = ["build"] }

# Package / install VSCode extension (thin host client)
package = { cmd = "npx @vscode/vsce package --no-dependencies --allow-missing-repository", depends-on = ["build-ext"] }
install = { cmd = "code --install-extension agent-team-0.1.0.vsix --force", depends-on = ["package"] }

# Formatting
fmt = "npm run fmt"
fmt-check = "npm run fmt:check"
